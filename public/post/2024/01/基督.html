        <h1>基督</h1>
<p>今天打完ec从上海回东秦，做公交遇到一个不会玩手机的一个老太太，问我去10公里外的教堂怎么去，路线太乱了也不太说得清楚，下午四点，单程坐公交得三个小时。但他好像还是跟着别人的指引去做礼拜了。听他说好像是从内蒙古过来的，路上还对我说上帝好信上帝。</p>
<p>我家村里也有这种，三四个老头老太坐着三轮车，有说有笑的不知道去哪里做礼拜还是什么集体活动(不知道我那村里有什么地方能去)</p>
<p>有意思，说不清。</p>
