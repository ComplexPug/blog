        </p>

    <div class="post-content">
        <p>用XiaoxinPro-13装Linux，每次配置代理都是不一样的经历。  <br>
直接用手机路由两台电脑切换又太麻烦，就这样解决了。  <br>
<pre><code class="language-">phone --热点--&gt; Win --tun+热点--&gt; Linux</code></pre><br>
TUN Mode是通过创建虚拟网卡的方式来代理所有流量。  <br>
然后电脑热点也会创建一个虚拟显卡。  <br>
打开控制面板\网络和 Internet\网络连接。  <br>
用tun的网卡共享到热点的网卡即可。</p>
